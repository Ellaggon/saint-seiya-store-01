name: Database integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: database-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fresh database and application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saint_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saint_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saint_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/saint_ci?schema=public
      NODE_ENV: test
      SMOKE_BASE_URL: http://127.0.0.1:4322
      MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject edits to shared migrations
        run: node scripts/database/assert-migrations-immutable.mjs "$MIGRATION_BASE_SHA" "$GITHUB_SHA"
      - name: Apply every migration to an empty PostgreSQL database
        run: npm run db:migrate:deploy
      - name: Confirm the database is fully migrated
        run: npm run db:migrate:status
      - name: Validate schema and generate Prisma Client
        run: |
          npm run db:validate
          npm run db:generate
      - name: Build application
        run: npm run build
      - name: Start integration server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4322 > /tmp/saint-integration.log 2>&1 &
          echo $! > /tmp/saint-integration.pid
      - name: Wait for integration server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4322/catalog > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saint-integration.log
          exit 1
      - name: Run integration smoke tests
        run: npm run test:integration
      - name: Stop integration server
        if: always()
        run: |
          if [ -f /tmp/saint-integration.pid ]; then
            kill "$(cat /tmp/saint-integration.pid)" || true
          fi
